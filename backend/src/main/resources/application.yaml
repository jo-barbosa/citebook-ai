spring:
  datasource:
    hikari:
      # every pool connection, including those opened while Flyway applies V2 (see V2__filtered_vector_search.sql)
      connection-init-sql: SET hnsw.iterative_scan = strict_order
  application:
    name: citebook-ai
  config:
    import: optional:file:.env[.properties] # local secrets, git-ignored; relative to the working directory (backend/)
  ai:
    model:
      chat: openai
      embedding: ollama
    openai:
      # The openai-java SDK appends /chat/completions: OpenRouter's endpoint is /api/v1/chat/completions.
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY}
      chat:
        model: z-ai/glm-5.3-flash
        max-retries: 1 # retries, not attempts: 2 requests at most (spec 7)
        timeout: 30s # per attempt; applied by ChatModelAdapter (see there)
        temperature: 0.2 # answers should stick to the excerpts
        max-tokens: 1024 # bounds cost and time on free models
    ollama:
      embedding:
        model: bge-m3
    mcp:
      server:
        # Streamable HTTP at /mcp. The protocol must be set: without it the starter serves the legacy SSE transport.
        protocol: STREAMABLE
        name: citebook-ai
        version: 0.0.1
        capabilities: # the server has tools only; do not advertise what it does not offer
          prompt: false
          resource: false
          completion: false
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

citebook:
  chunk-size: 800 # chosen in step 16 (evaluation, see README)
  chunk-overlap: 120 # 15% of chunk-size
  k: 5
  max-k: 8
  score-threshold: 0.53 # chosen in step 16: between real and off-topic questions' scores

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
