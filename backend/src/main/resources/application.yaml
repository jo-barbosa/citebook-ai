spring:
  application:
    name: citebook-ai
  config:
    import: optional:file:.env[.properties] # local secrets, git-ignored; relative to the working directory (backend/)
  ai:
    model:
      chat: openai
      embedding: ollama
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      timeout: 60s
      chat:
        model: z-ai/glm-5.3-flash
    ollama:
      embedding:
        model: bge-m3
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

citebook:
  chunk-size: 800 # chosen in step 16 (evaluation, see README)
  chunk-overlap: 120 # 15% of chunk-size
  k: 5
  max-k: 8
  score-threshold: 0.53 # chosen in step 16: between real and off-topic questions' scores

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
